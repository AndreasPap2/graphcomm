<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Multi-Line Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .tooltip {
    position: absolute;
    background-color: white;
    border: 2px solid #333;
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.25);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    width: 320px;        
    min-height: 80px;   
    line-height: 1.6;
}


        .line {
            fill: none;
            stroke-width: 2px;
        }
        #chart-title {
    width: 1200px;
    margin-left: 400px ;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 30px;
}
.hidden {
    opacity: 0;
    pointer-events: none;
}

.legend {
    cursor: pointer;
}



    </style>
</head>
<body>
    <h1 id="chart-title">Percentage of Comments by Category Over Time</h1>
    <div id="chart"></div>
    <div id="tooltip" class="tooltip" style="opacity:0;"></div>

    <script src="app.js"></script>
</body>
</html>
